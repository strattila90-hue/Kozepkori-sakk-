<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f4d8c">
<title>Parasztsakk – A Véres Udvar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-fart" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M9 22a5 5 0 0 1 0-10 6 6 0 0 1 11-2 5 5 0 0 1 4 12z" fill="#a9c94a"/><path d="M13 16q2 2 4 0M12 19q4 2 8 0" fill="none"/><circle cx="26" cy="22" r="2" fill="#a9c94a"/><circle cx="29" cy="25" r="1.2" fill="#a9c94a"/></g></symbol>
    <symbol id="i-nose" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M13 4c1 7 2 12-2 16 3 3 9 2 11-2-3-1-5-4-5-9z" fill="#efc9a0"/><circle cx="15" cy="21" r="1" fill="#2b1b10"/><path d="M24 24q2 3 0 4q-2-1 0-4z" fill="#8fc0e8"/></g></symbol>
    <symbol id="i-flag" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M8 4v25" fill="none"/><path d="M8 5q6-3 10 0t8 0v12q-4 3-8 0t-10 0z" fill="#fffdf4"/></g></symbol>
    <symbol id="i-scales" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><path d="M16 4v22M9 27h14M6 9h20"/><path d="M6 9l-3 8h6zM26 9l-3 8h6z" fill="#d9a935"/><path d="M3 17q3 4 6 0M23 17q3 4 6 0" fill="#d9a935"/></g></symbol>
    <symbol id="i-flip" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none"><path d="M6 15a10 10 0 0 1 18-5"/><path d="M26 17a10 10 0 0 1-18 5"/><path d="M24 4v7h-7M8 28v-7h7" fill="#d9a935"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M16 4v3M7 24c2-3 3-6 3-10a6 6 0 0 1 12 0c0 4 1 7 3 10z" fill="#d9a935"/><circle cx="16" cy="27" r="2.2" fill="#8a5a2b"/></g></symbol>
    <symbol id="i-scroll" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M8 5h17v18a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-2h4V8a3 3 0 0 0-2-3z" fill="#efe3c0"/><path d="M13 11h8M13 15h8M13 19h6" fill="none"/></g></symbol>
    <symbol id="i-lens" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.7" stroke-linecap="round" fill="none"><circle cx="13" cy="13" r="8" fill="#e8f0f8"/><path d="M19 19l9 9" stroke-width="3.4"/><path d="M13 9v8M9 13h8"/></g></symbol>
    <symbol id="i-sword" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M25 3l4 4-13 13-4-4z" fill="#cfd5dd"/><path d="M10 14l8 8M6 26l5-5" fill="none" stroke-width="2.4"/><path d="M12 22l-3 3-3-1 1-3z" fill="#8a5a2b"/><rect x="8.5" y="15" width="9" height="3" transform="rotate(45 13 16.5)" fill="#d9a935"/></g></symbol>
    <symbol id="i-key" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="11" cy="11" r="6" fill="#d9a935"/><circle cx="11" cy="11" r="2" fill="#efe3c0"/><path d="M15 15l12 12M22 22l3-3M25 25l3-3" fill="none" stroke-width="2.6"/></g></symbol>
    <symbol id="i-jester" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M5 14L3 4l8 5 5-6 5 6 8-5-2 10z" fill="#b8322a"/><circle cx="3" cy="4" r="2" fill="#d9a935"/><circle cx="16" cy="3" r="2" fill="#d9a935"/><circle cx="29" cy="4" r="2" fill="#d9a935"/><ellipse cx="16" cy="21" rx="8.5" ry="8" fill="#f3dfc3"/><path d="M12 20h.1M20 20h.1M12 25q4 3 8 0" fill="none" stroke-width="2"/></g></symbol>
    <symbol id="i-kings" viewBox="0 0 32 32"><g stroke="#2b1b10" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3 12l3-6 3 4 3-5 3 7z" fill="#d9a935"/><path d="M17 12l3-6 3 4 3-5 3 7z" fill="#d9a935" transform="translate(-1 6)"/><path d="M5 12h10v12H5zM16 18h11v10H16z" fill="#efe3c0" opacity=".0"/></g></symbol>
  </defs>
</svg>

<canvas id="c"></canvas>
<div id="toast"></div>

<div id="hud" class="hidden">
  <div class="plate top" id="oppPlate"><span class="sw" id="oppSw"></span><b id="oppName">Ellenfél</b><i id="oppStat"></i></div>
  <div id="turnBadge"></div>
  <div class="bottom">
    <div class="plate" id="mePlate"><span class="sw" id="meSw"></span><b id="meName">Te</b><i id="meStat"></i></div>
    <div class="btns">
      <button id="bFart"><svg><use href="#i-fart"/></svg><small>Pukk</small></button>
      <button id="bNose"><svg><use href="#i-nose"/></svg><small>Orrfúj</small></button>
      <button id="bDraw"><svg><use href="#i-scales"/></svg><small>Békekötés</small></button>
      <button id="bResign"><svg><use href="#i-flag"/></svg><small>Megadom</small></button>
      <button id="bZoom"><svg><use href="#i-lens"/></svg><small>Nagyít</small></button>
      <button id="bFlip"><svg><use href="#i-flip"/></svg><small>Fordít</small></button>
      <button id="bMute"><svg><use href="#i-bell"/></svg><small>Harang</small></button>
      <button id="bMenu"><svg><use href="#i-scroll"/></svg><small>Tekercs</small></button>
    </div>
  </div>
</div>

<div id="menu" class="screen">
  <div class="panel">
    <div class="logo"><span class="drop">P</span><span class="word">arasztsakk</span></div>
    <div class="sub">Vérrel, büdösséggel, szabályosan</div>
    <div class="rule"></div>
    <label>Nevezd meg magad, jobbágy<input id="name" maxlength="14" autocomplete="off" placeholder="Pocak Pista"></label>
    <div class="row-label">Seregednek zászlaja</div>
    <div class="swatches" id="swatches"></div>
    <div class="row-label">Ki kezd? (a szobanyitónak)</div>
    <div class="seg" id="sideSeg"><button data-v="w" class="on">Világos</button><button data-v="r">Sorsolás</button><button data-v="b">Sötét</button></div>
    <button class="big" id="btnCreate"><svg class="ic"><use href="#i-sword"/></svg>Hívd ki ellenfeledet</button>
    <div class="join"><input id="code" maxlength="5" placeholder="KÓD" autocomplete="off"><button class="big" id="btnJoin"><svg class="ic"><use href="#i-key"/></svg>Lépj a várba</button></div>
    <button id="btnResume" class="big alt hidden"></button>
    <div id="onlineNote" class="note hidden"></div>
    <div class="rule"></div>
    <div class="join"><select id="botLevel"><option value="1">Részeg jobbágy</option><option value="2" selected>Falusi bíró</option><option value="3">Hadúr</option></select><button class="big" id="btnBot"><svg class="ic"><use href="#i-jester"/></svg>Viadal a bolonddal</button></div>
    <button class="big" id="btnLocal"><svg class="ic"><use href="#i-kings"/></svg>Két úr egy asztalnál</button>
    <div class="opts"><label><input type="checkbox" id="optFast"> Sietős mészárlás (gyors mozgás)</label></div>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="panel">
    <div class="sub">A vár pecsétje</div>
    <div id="lobbyCode">-----</div>
    <div class="note">Küldd el ezt a jelet ellenfeled udvarába, és kezdődhet a vérontás.</div>
    <div class="join"><button class="big" id="btnCopy">Jel másolása</button><button class="big" id="btnShare">Hírnök küldése</button></div>
    <div class="wait">Az ellenfél útban van<span>.</span><span>.</span><span>.</span></div>
    <button class="big alt" id="btnLobbyCancel">Mégsem</button>
  </div>
</div>

<div id="promo" class="screen hidden"><div class="panel"><div class="sub">Válaszd ki az új rangot, uram!</div><div class="join" id="promoBtns"></div></div></div>

<div id="result" class="screen hidden"><div class="panel">
  <div id="resTitle" class="logo"><span class="word">Vége</span></div>
  <div id="resSub" class="sub"></div>
  <button class="big" id="btnAgain">Még egy csata!</button>
  <button class="big alt" id="btnToMenu">Vissza a várba</button>
</div></div>

<script src="firebase-config.js"></script>
<script src="js/chess.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/figures.js"></script>
<script src="js/world.js"></script>
<script src="js/lines.js"></script>
<script src="js/fx.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
</body>
</html>
