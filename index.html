<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3a2410">
<title>Parasztsakk – A Véres Udvar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="toast"></div>

<div id="hud" class="hidden">
  <div class="plate top"><span class="sw" id="oppSw"></span><b id="oppName">Ellenfél</b><i id="oppStat"></i></div>
  <div id="turnBadge"></div>
  <div class="bottom">
    <div class="plate"><span class="sw" id="meSw"></span><b id="meName">Te</b><i id="meStat"></i></div>
    <div class="btns">
      <button id="bFart" title="Puki">💨<small>Puki</small></button>
      <button id="bNose" title="Orrfújás">🤧<small>Orr</small></button>
      <button id="bDraw" title="Döntetlen">½<small>Döntetlen</small></button>
      <button id="bResign" title="Feladom">🏳️<small>Feladom</small></button>
      <button id="bFlip" title="Tábla forgatása">🔄<small>Forgat</small></button>
      <button id="bMute" title="Hang">🔊<small>Hang</small></button>
      <button id="bMenu" title="Menü">☰<small>Menü</small></button>
    </div>
  </div>
</div>

<div id="menu" class="screen">
  <div class="panel">
    <div class="logo"><span class="drop">P</span><span class="word">ARASZTSAKK</span></div>
    <div class="sub">Véres · Büdös · Szabályos</div>
    <label>Neved<input id="name" maxlength="14" autocomplete="off" placeholder="Paraszt Pista"></label>
    <div class="row-label">Sereged színe</div>
    <div class="swatches" id="swatches"></div>
    <div class="row-label">Kezdő oldal (szobateremtőnek)</div>
    <div class="seg" id="sideSeg"><button data-v="w" class="on">Világos</button><button data-v="r">Véletlen</button><button data-v="b">Sötét</button></div>
    <button class="big" id="btnCreate">⚔ Új szoba (meghívó kód)</button>
    <div class="join"><input id="code" maxlength="5" placeholder="KÓD" autocomplete="off"><button class="big" id="btnJoin">🔑 Csatlakozás</button></div>
    <button id="btnResume" class="hidden"></button>
    <div id="onlineNote" class="note hidden"></div>
    <hr>
    <div class="join"><select id="botLevel"><option value="1">Részeg paraszt</option><option value="2" selected>Falusi bíró</option><option value="3">Hadvezér</option></select><button class="big" id="btnBot">🤖 Bot ellen</button></div>
    <button class="big" id="btnLocal">👥 Két játékos egy gépen</button>
    <div class="opts"><label><input type="checkbox" id="optFast"> Gyors animáció</label></div>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="panel">
    <div class="sub">A szoba kódja</div>
    <div id="lobbyCode">-----</div>
    <div class="note">Küldd el a barátodnak a kódot (vagy a linket), és már jön is a vérengzés.</div>
    <div class="join"><button class="big" id="btnCopy">📋 Kód másolása</button><button class="big" id="btnShare">🔗 Link</button></div>
    <div class="wait">Várakozás az ellenfélre<span>.</span><span>.</span><span>.</span></div>
    <button id="btnLobbyCancel">Mégse</button>
  </div>
</div>

<div id="promo" class="screen hidden"><div class="panel"><div class="sub">Válaszd ki az új rangot!</div><div class="join" id="promoBtns"></div></div></div>

<div id="result" class="screen hidden"><div class="panel">
  <div id="resTitle" class="logo"><span class="word">VÉGE</span></div>
  <div id="resSub" class="sub"></div>
  <button class="big" id="btnAgain">Még egyet!</button>
  <button class="big" id="btnToMenu">Főmenü</button>
</div></div>

<script src="firebase-config.js"></script>
<script src="js/chess.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/world.js"></script>
<script src="js/fx.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
</body>
</html>
